<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>シフトボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#F2F5F3;
    --panel:#FFFFFF;
    --ink:#1B2624;
    --ink-soft:#5B6864;
    --line:#D7DFDA;
    --teal:#1F6F63;
    --teal-dark:#154B43;
    --gold:#C99A3C;
    --rust:#B5533C;
    --am:#3C7FB5;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- ログイン画面 ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-card{width:100%;max-width:420px;}
  .gate-title{font-family:var(--font-display);font-size:34px;font-weight:600;margin:0 0 4px;color:var(--teal-dark);}
  .gate-sub{color:var(--ink-soft);margin:0 0 28px;font-size:14px;letter-spacing:.02em;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  select, input[type=text], input[type=password], input[type=number], input[type=time]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--panel);
    font-family:var(--font-body);font-size:15px;color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 18px;border-radius:2px;border:1px solid var(--teal-dark);
    background:var(--teal);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--font-body);
  }
  .btn:hover{background:var(--teal-dark);}
  .btn.ghost{background:transparent;color:var(--teal-dark);border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--teal-dark);}
  .btn.danger{background:#fff;color:var(--rust);border-color:var(--rust);}
  .btn.danger:hover{background:var(--rust);color:#fff;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .link-row{margin-top:18px;text-align:center;}
  .link-btn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:13px;font-family:var(--font-body);}

  /* ---------- レイアウト ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .brand{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--teal-dark);}
  .who{font-size:13px;color:var(--ink-soft);}
  .who b{color:var(--ink);}
  .main-wrap{display:flex;flex:1;min-height:0;}
  .nav{
    width:200px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
    padding:16px 0;
  }
  .nav-item{
    display:block;width:100%;text-align:left;padding:11px 22px;border:none;background:none;
    font-size:14px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);
    border-left:3px solid transparent;
  }
  .nav-item:hover{color:var(--ink);}
  .nav-item.active{color:var(--teal-dark);border-left-color:var(--teal);background:#EAF1EE;font-weight:600;}
  .content{flex:1;padding:28px 32px;overflow:auto;}
  .view-title{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0 0 4px;}
  .view-sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}

  /* ---------- 共通パーツ ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:20px;}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .row.between{justify-content:space-between;}
  .tag{display:inline-block;padding:2px 8px;font-size:12px;border:1px solid var(--line);color:var(--ink-soft);}
  .month-nav{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:15px;}
  .month-nav button{background:none;border:1px solid var(--line);width:30px;height:30px;cursor:pointer;font-size:14px;}

  /* ---------- カレンダー ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .cal-head{background:#EFF3F0;text-align:center;font-size:12px;padding:8px 0;color:var(--ink-soft);font-weight:600;}
  .cal-cell{background:var(--panel);min-height:78px;padding:6px;position:relative;cursor:pointer;}
  .cal-cell.empty{background:var(--paper);cursor:default;}
  .cal-cell:hover:not(.empty){background:#F5F8F6;}
  .cal-date{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}
  .cal-date.dow-sat, th.dow-sat, .cal-head.dow-sat{color:var(--am);font-weight:700;}
  .cal-date.dow-sun, th.dow-sun, .cal-head.dow-sun{color:var(--rust);font-weight:700;}
  .tbl td.dow-sat-bg{background:#EEF4F9;}
  .tbl td.dow-sun-bg{background:#FBEFEA;}
  .cal-cell.closed{background:#F0EEEA;cursor:not-allowed;}
  .cal-cell.closed:hover{background:#F0EEEA;}
  .cal-closed-label{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .cal-status{margin-top:8px;font-size:11.5px;padding:3px 6px;display:inline-block;font-weight:600;}
  .st-FULL{background:#F3E4DE;color:var(--rust);}
  .st-AM{background:#E1EBF3;color:var(--am);}
  .st-PM{background:#F5EEDD;color:var(--gold);}
  .cal-legend{display:flex;gap:16px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .cal-legend span::before{content:'';display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;}
  .leg-FULL::before{background:var(--rust);}
  .leg-AM::before{background:var(--am);}
  .leg-PM::before{background:var(--gold);}

  /* ---------- テーブル ---------- */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th, table.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
  table.tbl th{background:#EFF3F0;font-weight:600;color:var(--ink-soft);}
  table.tbl td.center{text-align:center;}
  .scroll-x{overflow-x:auto;}

  /* ---------- 一覧行 ---------- */
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  .slot-edit-row{display:grid;grid-template-columns:1.3fr .9fr .9fr .8fr .6fr auto;gap:10px;align-items:end;margin-bottom:12px;}
  .slot-edit-row label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 20px;font-size:13px;border-radius:2px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .toast.show{opacity:1;}

  .empty-state{padding:40px 0;text-align:center;color:var(--ink-soft);}

  @media (max-width:720px){
    .main-wrap{flex-direction:column;}
    .nav{width:100%;display:flex;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--line);}
    .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:8px 14px;}
    .nav-item.active{border-left:none;border-bottom-color:var(--teal);}
    .content{padding:18px;}
    .slot-edit-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   設定：Apps Script側で自動的に埋め込まれるため、手動での書き換えは不要です
   ==================================================================== */
const GAS_URL = '<?!= gasUrl ?>';

/* ====================================================================
   状態管理
   ==================================================================== */
const state = {
  boot: null,          // {locations, staff, slots, patterns, patternSlots, weekdayPatterns}
  role: null,          // 'staff' | 'admin'
  locationId: null,
  staffId: null,
  view: null,
  month: monthStr(new Date()),
  requests: [],
  shifts: [],
  preferences: [],
  events: [],
  holidays: [],
  dayOverrides: [],
};
const WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];

function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInMonth(month){ const [y,m]=month.split('-').map(Number); return new Date(y,m,0).getDate(); }
function pad(n){ return String(n).padStart(2,'0'); }

/* ====================================================================
   API通信（text/plainでPOSTしCORSプリフライトを回避）
   ==================================================================== */
async function apiGet(action, params={}){
  const q = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(GAS_URL + '?' + q);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error||'error');
  return json.data;
}
async function apiPost(action, payload={}){
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error||'error');
  return json.data;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ====================================================================
   起動
   ==================================================================== */
const app = document.getElementById('app');

async function boot(){
  try{
    state.boot = await apiGet('bootstrap');
    normalizeBoot_();
  }catch(e){
    app.innerHTML = `<div class="gate"><div class="gate-card">
      <h1 class="gate-title">接続できません</h1>
      <p class="gate-sub">GAS_URL の設定を確認してください。（${e.message}）</p>
    </div></div>`;
    return;
  }
  renderGate();
}

// スプレッドシート側で数値扱いされたID等が混ざっても正しく照合できるよう、
// 受信データのID系フィールドは必ず文字列に統一する
function normalizeBoot_(){
  const b = state.boot;
  b.locations.forEach(x=>{ x.id=String(x.id); });
  b.staff.forEach(x=>{ x.id=String(x.id); x.locationId=String(x.locationId); });
  b.slots.forEach(x=>{ x.id=String(x.id); x.locationId=String(x.locationId); });
  (b.patterns||[]).forEach(x=>{ x.id=String(x.id); x.locationId=String(x.locationId); });
  (b.patternSlots||[]).forEach(x=>{ x.patternId=String(x.patternId); x.slotId=String(x.slotId); });
  (b.weekdayPatterns||[]).forEach(x=>{ x.locationId=String(x.locationId); x.dayOfWeek=String(x.dayOfWeek); x.patternId=String(x.patternId); });
}
function normalizeMonthData_(){
  state.requests.forEach(x=>{ x.locationId=String(x.locationId); x.staffId=String(x.staffId); });
  state.shifts.forEach(x=>{ x.locationId=String(x.locationId); x.slotId=String(x.slotId); x.staffId=String(x.staffId); });
  state.preferences.forEach(x=>{ x.locationId=String(x.locationId); x.staffId=String(x.staffId); });
  state.events.forEach(x=>{ x.locationId=String(x.locationId); });
  state.dayOverrides.forEach(x=>{ x.locationId=String(x.locationId); });
}

/* 土日祝の判定・色分け・入力可否 */
function isHoliday(dateStr){ return state.holidays.includes(dateStr); }
function dowColorClass(dow, dateStr){
  if(dow===6) return 'dow-sat';
  if(dow===0 || isHoliday(dateStr)) return 'dow-sun';
  return '';
}
function isInputAllowed(dateStr, dow){
  const ov = state.dayOverrides.find(o=>o.date===dateStr);
  if(ov) return ov.allowInput==='TRUE' || ov.allowInput===true;
  return !(dow===0 || dow===6 || isHoliday(dateStr));
}
function sharingEnabled(loc){
  const v = loc && loc.shareRequests;
  if(v===undefined || v===null || v==='') return true; // 未設定はデフォルトで共有あり
  return v===true || String(v).toUpperCase()==='TRUE';
}

/* ====================================================================
   ログイン画面
   ==================================================================== */
function renderGate(){
  const locations = state.boot.locations;
  app.innerHTML = `
    <div class="gate"><div class="gate-card">
      <h1 class="gate-title">シフトボード</h1>
      <p class="gate-sub">拠点と名前を選んで開始してください</p>
      <div class="field">
        <label>拠点</label>
        <select id="g-loc">
          <option value="">選択してください</option>
          ${locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>名前</label>
        <select id="g-staff" disabled><option value="">先に拠点を選択</option></select>
      </div>
      <button class="btn block" id="g-enter" disabled>スタッフとして入室</button>
      <div class="link-row"><button class="link-btn" id="g-admin">管理者としてログイン</button></div>
    </div></div>`;

  document.getElementById('g-loc').addEventListener('change', (e)=>{
    const locId = e.target.value;
    const sel = document.getElementById('g-staff');
    const staffOfLoc = state.boot.staff.filter(s=>s.locationId===locId);
    sel.disabled = !locId;
    sel.innerHTML = staffOfLoc.length
      ? `<option value="">選択してください</option>` + staffOfLoc.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')
      : `<option value="">スタッフが未登録です</option>`;
    document.getElementById('g-enter').disabled = true;
  });
  document.getElementById('g-staff').addEventListener('change', (e)=>{
    document.getElementById('g-enter').disabled = !e.target.value;
  });
  document.getElementById('g-enter').addEventListener('click', async ()=>{
    state.locationId = document.getElementById('g-loc').value;
    state.staffId = document.getElementById('g-staff').value;
    state.role = 'staff';
    state.view = 'request';
    await loadMonthData();
    renderShell();
  });
  document.getElementById('g-admin').addEventListener('click', renderAdminGate);
}

function renderAdminGate(){
  const locations = state.boot.locations;
  app.innerHTML = `
    <div class="gate"><div class="gate-card">
      <h1 class="gate-title">管理者ログイン</h1>
      <p class="gate-sub">拠点とPINコードを入力してください</p>
      <div class="field">
        <label>拠点</label>
        <select id="a-loc">
          <option value="">選択してください（新規拠点は後で追加可）</option>
          ${locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>管理者PIN</label>
        <input type="password" id="a-pin" placeholder="初期値: 0000" />
      </div>
      <button class="btn block" id="a-enter">管理画面へ</button>
      <div class="link-row"><button class="link-btn" id="a-back">戻る</button></div>
    </div></div>`;
  document.getElementById('a-back').addEventListener('click', renderGate);
  document.getElementById('a-enter').addEventListener('click', async ()=>{
    const pin = document.getElementById('a-pin').value;
    try{
      const r = await apiPost('checkAdminPin', {pin});
      if(!r.valid){ toast('PINが違います'); return; }
    }catch(e){ toast('通信エラー: '+e.message); return; }
    state.locationId = document.getElementById('a-loc').value || (state.boot.locations[0]||{}).id || null;
    state.role = 'admin';
    state.view = 'staffAdmin';
    if(state.locationId) await loadMonthData();
    renderShell();
  });
}

async function loadMonthData(){
  if(!state.locationId) return;
  [state.requests, state.shifts, state.preferences, state.events, state.holidays, state.dayOverrides] = await Promise.all([
    apiGet('requests', {locationId: state.locationId, month: state.month}),
    apiGet('shifts', {locationId: state.locationId, month: state.month}),
    apiGet('preferences', {locationId: state.locationId, month: state.month}),
    apiGet('events', {locationId: state.locationId, month: state.month}),
    apiGet('holidays', {month: state.month}),
    apiGet('dayOverrides', {locationId: state.locationId, month: state.month}),
  ]);
  normalizeMonthData_();
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ====================================================================
   シェル（トップバー＋ナビ＋コンテンツ）
   ==================================================================== */
function renderShell(){
  const loc = state.boot.locations.find(l=>l.id===state.locationId);
  const me = state.boot.staff.find(s=>s.id===state.staffId);
  const staffNav = [
    ['request','希望申請'],
    ['overview','みんなの希望状況'],
    ['events','共有イベント'],
    ['shift','シフト表'],
  ];
  const adminNav = [
    ['staffAdmin','スタッフ管理'],
    ['locAdmin','拠点管理'],
    ['slotAdmin','勤務時間帯設定'],
    ['patternAdmin','勤務パターン'],
    ['businessDays','営業日設定'],
    ['overview','希望状況一覧'],
    ['events','共有イベント'],
    ['generate','シフト自動生成'],
    ['shift','シフト表・PDF出力'],
  ];
  const nav = state.role==='admin' ? adminNav : staffNav;

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">シフトボード</div>
      <div class="who">
        ${loc ? `<span class="tag">${esc(loc.name)}</span> ` : ''}
        ${state.role==='admin' ? '管理者モード' : `<b>${esc(me?me.name:'')}</b> さん`}
        &nbsp;·&nbsp; <button class="link-btn" id="logout">ログアウト</button>
      </div>
    </div>
    <div class="main-wrap">
      <div class="nav">${nav.map(([k,label])=>`<button class="nav-item ${state.view===k?'active':''}" data-view="${k}">${label}</button>`).join('')}</div>
      <div class="content" id="content"></div>
    </div>`;
  document.getElementById('logout').addEventListener('click', ()=>{ state.role=null; state.locationId=null; state.staffId=null; renderGate(); });
  app.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click', ()=>{ state.view=b.dataset.view; renderShell(); }));

  const content = document.getElementById('content');
  const renderers = {
    request: renderRequestView,
    overview: renderOverviewView,
    shift: renderShiftView,
    events: renderEventsView,
    staffAdmin: renderStaffAdminView,
    locAdmin: renderLocAdminView,
    slotAdmin: renderSlotAdminView,
    patternAdmin: renderPatternAdminView,
    businessDays: renderBusinessDaysView,
    generate: renderGenerateView,
  };
  (renderers[state.view]||renderRequestView)(content);
}

/* ====================================================================
   スタッフ：希望申請カレンダー
   ==================================================================== */
const STATUS_CYCLE = [null,'FULL','AM','PM'];
const STATUS_LABEL = {FULL:'1日不可', AM:'午前不可', PM:'午後不可'};

function renderRequestView(root){
  const myPref = state.preferences.find(p=>p.staffId===state.staffId) || {};
  const loc = state.boot.locations.find(l=>l.id===state.locationId) || {};
  const sharing = sharingEnabled(loc);
  root.innerHTML = `
    <h2 class="view-title">希望申請</h2>
    <p class="view-sub">日付をクリックすると 空欄 → 1日不可 → 午前不可 → 午後不可 → 空欄 の順に切り替わります（土曜＝青、日曜・祝日＝赤。休業日は入力できません）</p>
    <div class="panel">
      ${monthNavHtml()}
      <div id="cal"></div>
      <div class="cal-legend">
        <span class="leg-FULL">1日不可</span>
        <span class="leg-AM">午前不可</span>
        <span class="leg-PM">午後不可</span>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn danger" id="clear-month">この月の申請を一括クリア</button>
      </div>
    </div>
    <div class="panel">
      <p class="muted" style="margin:0 0 12px;">この項目は他のスタッフには公開されません。管理者のみ確認でき、シフト作成時の参考として使われます（必ず希望通りになるわけではありません）</p>
      <div class="row">
        <div class="field" style="max-width:160px;margin-bottom:0;">
          <label>週◯日希望</label>
          <input type="number" min="0" max="7" id="pref-weekly" value="${myPref.weeklyDays||''}" />
        </div>
        <div class="field" style="max-width:160px;margin-bottom:0;">
          <label>月◯日希望</label>
          <input type="number" min="0" max="31" id="pref-monthly" value="${myPref.monthlyDays||''}" />
        </div>
        <button class="btn ghost" id="pref-save" style="align-self:flex-end;">保存</button>
      </div>
    </div>
    ${sharing ? `
    <div class="panel">
      <h3 style="margin:0 0 12px;font-size:15px;">他のスタッフの申請状況</h3>
      <div class="scroll-x" id="others-ov"></div>
    </div>` : `
    <div class="panel"><p class="muted" style="margin:0;">この拠点では、他のスタッフの申請状況の共有が管理者によって無効にされています。</p></div>`}`;
  bindMonthNav(root, ()=>renderRequestView(root));
  drawMyCalendar(document.getElementById('cal'));
  if(sharing) drawOverviewTable(document.getElementById('others-ov'));
  document.getElementById('clear-month').addEventListener('click', async ()=>{

function bindMonthNav(root, cb){

function drawMyCalendar(el){
  const n = daysInMonth(state.month);
  const [y,m] = state.month.split('-').map(Number);
  const firstDow = new Date(y,m-1,1).getDay();
  const myReqs = {};
  state.requests.filter(r=>r.staffId===state.staffId).forEach(r=>myReqs[r.date]=r.type);

  let html = `<div class="cal-grid">`;
  WEEKDAY_LABELS.forEach((d,i)=>html+=`<div class="cal-head ${dowColorClass(i,'')}">${d}</div>`);
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=n; d++){
    const dateStr = `${state.month}-${pad(d)}`;
    const dow = new Date(y,m-1,d).getDay();
    const type = myReqs[dateStr];
    const allowed = isInputAllowed(dateStr, dow);
    html += `<div class="cal-cell ${allowed?'':'closed'}" data-date="${dateStr}" data-allowed="${allowed?'1':'0'}">
      <div class="cal-date ${dowColorClass(dow,dateStr)}">${d}</div>
      ${type ? `<div class="cal-status st-${type}">${STATUS_LABEL[type]}</div>` : ''}
      ${!allowed ? `<div class="cal-closed-label">休業日</div>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    if(cell.dataset.allowed==='0') return; // 休業日はクリック不可
    cell.addEventListener('click', async ()=>{
      const date = cell.dataset.date;
      const cur = myReqs[date] || null;
      const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1) % STATUS_CYCLE.length];

      // サーバー応答を待たずに即時反映（体感速度優先）。失敗時のみ元に戻す
      state.requests = state.requests.filter(r=>!(r.staffId===state.staffId && r.date===date));
      if(next) state.requests.push({locationId:state.locationId, staffId:state.staffId, date, type:next});
      drawMyCalendar(el);

      try{
        await apiPost('setRequest', {locationId:state.locationId, staffId:state.staffId, date, type: next||'NONE'});
        toast('保存しました');
      }catch(e){
        toast('保存失敗: '+e.message);
        await loadMonthData();
        drawMyCalendar(el);
      }
    });
  });
}

function drawBusinessDayCalendar(el){
  const n = daysInMonth(state.month);
  const [y,m] = state.month.split('-').map(Number);
  const firstDow = new Date(y,m-1,1).getDay();

  let html = `<div class="cal-grid">`;
  WEEKDAY_LABELS.forEach((d,i)=>html+=`<div class="cal-head ${dowColorClass(i,'')}">${d}</div>`);
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=n; d++){
    const dateStr = `${state.month}-${pad(d)}`;
    const dow = new Date(y,m-1,d).getDay();
    const ov = state.dayOverrides.find(o=>o.date===dateStr);
    const defaultClosed = (dow===0||dow===6||isHoliday(dateStr));
    let bg = '';
    let label = defaultClosed ? '休業（既定）' : '営業（既定）';
    if(ov){
      const open = ov.allowInput==='TRUE'||ov.allowInput===true;
      bg = open ? 'background:#DCEEE7;' : 'background:#F3E4DE;';
      label = open ? '営業（上書き）' : '休業（上書き）';
    }
    html += `<div class="cal-cell" data-date="${dateStr}" style="${bg}">
      <div class="cal-date ${dowColorClass(dow,dateStr)}">${d}</div>
      <div class="cal-closed-label">${label}</div>
    </div>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', async ()=>{
      const date = cell.dataset.date;
      const ov = state.dayOverrides.find(o=>o.date===date);
      // サイクル: 上書きなし → 営業に上書き → 休業に上書き → 上書きなし
      let nextAllow;
      if(!ov) nextAllow = true;
      else if(ov.allowInput==='TRUE'||ov.allowInput===true) nextAllow = false;
      else nextAllow = ''; // 上書き解除
      await apiPost('setDayOverride', {locationId: state.locationId, date, allowInput: nextAllow});
      state.dayOverrides = await apiGet('dayOverrides', {locationId: state.locationId, month: state.month});
      normalizeMonthData_();
      drawBusinessDayCalendar(el);
    });
  });
}

function renderSlotAdminView(root){
  const slots = state.boot.slots.filter(s=>s.locationId===state.locationId)
    .map(s=>({...s}));
  if(slots.length===0) slots.push({id:'', name:'', start:'09:00', end:'13:00', breakMin:0, required:1});

    </div>
    <button class="btn" id="save-slots">保存する</button>`;

  const rowsEl = document.getElementById('slot-rows');
  function drawRows(){
    rowsEl.innerHTML = slots.map((s,i)=>`
      <div class="slot-edit-row" data-i="${i}">
        <div><label>時間帯名</label><input type="text" class="f-name" value="${esc(s.name)}" placeholder="例：早番"/></div>

        <div><label>終了</label><input type="time" class="f-end" value="${s.end||'13:00'}"/></div>
        <div><label>休憩(分)</label><input type="number" class="f-break" value="${s.breakMin||0}" min="0"/></div>
        <div><label>必要人数</label><input type="number" class="f-req" value="${s.required||1}" min="1"/></div>
        <div><button class="btn danger f-del">削除</button></div>
      </div>`).join('');
    rowsEl.querySelectorAll('.slot-edit-row').forEach(row=>{
      const i = Number(row.dataset.i);
      row.querySelector('.f-name').addEventListener('input', e=>slots[i].name=e.target.value);
      row.querySelector('.f-start').addEventListener('input', e=>slots[i].start=e.target.value);
      row.querySelector('.f-end').addEventListener('input', e=>slots[i].end=e.target.value);
      row.querySelector('.f-break').addEventListener('input', e=>slots[i].breakMin=e.target.value);
      row.querySelector('.f-req').addEventListener('input', e=>slots[i].required=e.target.value);
      row.querySelector('.f-del').addEventListener('click', ()=>{ slots.splice(i,1); drawRows(); });

  drawRows();
  document.getElementById('add-slot-row').addEventListener('click', ()=>{

    drawRows();
  });
  document.getElementById('save-slots').addEventListener('click', async ()=>{
    const cleaned = slots.filter(s=>s.name.trim());
    await apiPost('saveTimeSlots', {locationId: state.locationId, slots: cleaned});

    toast('保存しました');
    renderSlotAdminView(root);
  });
}

    <h2 class="view-title">勤務パターン</h2>
    <p class="view-sub">「通し2名」「通し＋午前＋午後の3名」のような人員配置のグループを作り、曜日ごとに使うパターンを決められます。パターンを設定しない曜日は、勤務時間帯設定の「必要人数」がそのまま使われます。</p>
    ${slotsOfLoc.length===0 ? '<div class="panel empty-state">先に「勤務時間帯設定」で時間帯を登録してください</div>' : `
    <div class="panel" id="pattern-list"></div>
    <button class="btn ghost" id="add-pattern" style="margin-bottom:20px;">＋ パターンを追加</button>
    <div class="panel">
      <h3 style="margin:0 0 12px;font-size:15px;">曜日ごとの既定パターン</h3>
      <div class="row" id="weekday-row"></div>
      <button class="btn" id="save-weekday" style="margin-top:16px;">曜日設定を保存</button>
    </div>`}`;

  if(slotsOfLoc.length===0) return;

  const listEl = document.getElementById('pattern-list');
  function drawPatterns(){
    listEl.innerHTML = patterns.map((p,pi)=>`
      <div class="panel" style="margin-bottom:14px;" data-pi="${pi}">
        <div class="row between" style="margin-bottom:10px;">
          <input type="text" class="pat-name" data-pi="${pi}" value="${esc(p.name)}" placeholder="パターン名（例：通し2名）" style="max-width:260px;" />
          <button class="btn danger pat-del" data-pi="${pi}">パターンを削除</button>
        </div>
        <div class="pat-slots" data-pi="${pi}"></div>
        <button class="btn ghost pat-add-slot" data-pi="${pi}" style="margin-top:8px;">＋ 時間帯を追加</button>
      </div>`).join('') || '<div class="empty-state">まだパターンがありません</div>';

    patterns.forEach((p,pi)=>{
      const slotsEl = listEl.querySelector(`.pat-slots[data-pi="${pi}"]`);
      slotsEl.innerHTML = p.slots.map((s,si)=>`
        <div class="row" style="margin-bottom:8px;" data-si="${si}">
          <select class="pat-slot-select" data-pi="${pi}" data-si="${si}" style="max-width:220px;">
            ${slotsOfLoc.map(so=>`<option value="${so.id}" ${so.id===s.slotId?'selected':''}>${esc(so.name)}（${so.start}-${so.end}）</option>`).join('')}
          </select>
          <input type="number" class="pat-slot-req" data-pi="${pi}" data-si="${si}" value="${s.required||1}" min="1" style="max-width:90px;" />
          <span class="muted">名</span>
          <button class="btn danger pat-slot-del" data-pi="${pi}" data-si="${si}">削除</button>
        </div>`).join('');
    });

    listEl.querySelectorAll('.pat-name').forEach(inp=>inp.addEventListener('input', e=>{
      patterns[Number(e.target.dataset.pi)].name = e.target.value;
    }));
    listEl.querySelectorAll('.pat-del').forEach(b=>b.addEventListener('click', ()=>{
      patterns.splice(Number(b.dataset.pi),1); drawPatterns();
    }));
    listEl.querySelectorAll('.pat-add-slot').forEach(b=>b.addEventListener('click', ()=>{
      patterns[Number(b.dataset.pi)].slots.push({slotId: slotsOfLoc[0].id, required:1}); drawPatterns();
    }));
    listEl.querySelectorAll('.pat-slot-select').forEach(sel=>sel.addEventListener('change', e=>{
      patterns[Number(e.target.dataset.pi)].slots[Number(e.target.dataset.si)].slotId = e.target.value;
    }));
    listEl.querySelectorAll('.pat-slot-req').forEach(inp=>inp.addEventListener('input', e=>{
      patterns[Number(e.target.dataset.pi)].slots[Number(e.target.dataset.si)].required = e.target.value;
    }));
    listEl.querySelectorAll('.pat-slot-del').forEach(b=>b.addEventListener('click', ()=>{
      patterns[Number(b.dataset.pi)].slots.splice(Number(b.dataset.si),1); drawPatterns();
    }));
  }
  drawPatterns();

  document.getElementById('add-pattern').addEventListener('click', async ()=>{
    patterns.push({id:'', name:'新しいパターン', slots:[{slotId: slotsOfLoc[0].id, required:1}]});
    drawPatterns();
    await savePatternsToServer();
  });

  async function savePatternsToServer(){
    const cleaned = patterns.filter(p=>p.name.trim()).map(p=>({...p, slots: p.slots.filter(s=>s.slotId)}));
    await apiPost('savePatterns', {locationId: state.locationId, patterns: cleaned});
    const fresh = await apiGet('bootstrap');
    state.boot = fresh;
    toast('保存しました');
    renderPatternAdminView(root);
  }
  // まとめて保存するボタンをパターン一覧の下に用意する代わりに、簡易的に一覧操作のたびサーバー保存はせず、
  // 明示的な保存ボタンを設置する
  const savePatBtn = document.createElement('button');
  savePatBtn.className = 'btn';
  savePatBtn.textContent = 'パターンを保存する';
  savePatBtn.style.marginBottom = '20px';
  listEl.after(savePatBtn);
  savePatBtn.addEventListener('click', savePatternsToServer);

  // 曜日既定パターン
  const wdRow = document.getElementById('weekday-row');
  wdRow.innerHTML = WEEKDAY_LABELS.map((label,dow)=>`
    <div class="field" style="max-width:130px;margin-bottom:0;">
      <label>${label}曜</label>
      <select class="wd-select" data-dow="${dow}">
        <option value="">（未設定）</option>
        ${patterns.map(p=>`<option value="${p.id}" ${weekdayMap[String(dow)]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>`).join('');
  document.getElementById('save-weekday').addEventListener('click', async ()=>{
    const map = {};
    wdRow.querySelectorAll('.wd-select').forEach(sel=>{ map[sel.dataset.dow] = sel.value; });
    await apiPost('saveWeekdayPatterns', {locationId: state.locationId, map});
    const fresh = await apiGet('bootstrap');
    state.boot = fresh;
    toast('保存しました');
    renderPatternAdminView(root);
  });
}

/* ====================================================================
   管理者：シフト自動生成
   ==================================================================== */
function renderGenerateView(root){
  root.innerHTML = `
    <h2 class="view-title">シフト自動生成</h2>
    <p class="view-sub">申請された不可日を踏まえて、選んだルールで自動的にシフトを組みます（この機能はスタッフ画面には表示されません）</p>
    <div class="panel">
      ${monthNavHtml()}
      <div class="field" style="max-width:360px;">
        <label>割り当てルール</label>
        <select id="rule">
          <option value="balance">不可日を避けつつ均等に配分</option>
          <option value="coverage">不可日を避けつつ人手不足を優先して埋める</option>
          <option value="avoidOnly">とにかく不可日さえ避ければよい</option>
        </select>
      </div>
      <button class="btn" id="run-gen">自動生成する</button>
      <p class="muted" id="gen-result" style="margin-top:10px;"></p>
    </div>
    <div class="panel" id="gen-preview"></div>`;
  bindMonthNav(root, ()=>renderGenerateView(root));

  document.getElementById('run-gen').addEventListener('click', async ()=>{
    const rule = document.getElementById('rule').value;
    document.getElementById('gen-result').textContent = '生成中...';
    try{
      const result = await apiPost('generateShifts', {locationId: state.locationId, month: state.month, rule});
      state.shifts = result.assignments;
      document.getElementById('gen-result').textContent =
        result.unfilled>0 ? `生成しました（人員が不足しているコマが ${result.unfilled} 件あります）` : '生成しました（すべてのコマを充足）';
      drawShiftTable(document.getElementById('gen-preview'), true);
    }catch(e){ document.getElementById('gen-result').textContent = 'エラー: '+e.message; }
  });
  document.getElementById('gen-preview').innerHTML = state.shifts.length ? '' : '<div class="empty-state">まだ生成していません</div>';
  if(state.shifts.length) drawShiftTable(document.getElementById('gen-preview'), true);
}

/* ====================================================================
   シフト表（閲覧・保存・PDF）
   ==================================================================== */
function renderShiftView(root){
  root.innerHTML = `
    <h2 class="view-title">シフト表</h2>
    <p class="view-sub">確定したシフトを確認できます</p>
    <div class="panel">${monthNavHtml()}
      <div class="row" style="margin-bottom:12px;">
        ${state.role==='admin' ? '<button class="btn ghost" id="save-shift">編集内容を保存</button>' : ''}
        <button class="btn" id="export-pdf">PDFで出力</button>
      </div>
      <div class="scroll-x" id="shift-table"></div>
    </div>`;
  bindMonthNav(root, ()=>renderShiftView(root));
  drawShiftTable(document.getElementById('shift-table'), state.role==='admin');
  if(state.role==='admin'){
    document.getElementById('save-shift').addEventListener('click', async ()=>{
      const assignments = readShiftTableFromDOM();
      await apiPost('saveShifts', {locationId: state.locationId, month: state.month, assignments});
      toast('保存しました');
    });
  }
  document.getElementById('export-pdf').addEventListener('click', exportShiftPdf);
}

function drawShiftTable(el, editable){
  const slots = state.boot.slots.filter(s=>s.locationId===state.locationId);
  const staffMap = {}; state.boot.staff.forEach(s=>staffMap[s.id]=s.name);
  const n = daysInMonth(state.month);
  if(slots.length===0){ el.innerHTML = '<div class="empty-state">勤務時間帯が未設定です</div>'; return; }

  const cellMap = {}; // date__slotId -> [staffId,...]
  state.shifts.forEach(a=>{
    const k = a.date+'__'+a.slotId;
    (cellMap[k] = cellMap[k]||[]).push(a.staffId);
  });

  let html = '<table class="tbl" id="shift-tbl"><thead><tr><th>日付</th>';
  slots.forEach(s=>html += `<th>${esc(s.name)}<br><span class="muted">${s.start}-${s.end}</span></th>`);
  html += '</tr></thead><tbody>';
  for(let d=1; d<=n; d++){
    const dateStr = `${state.month}-${pad(d)}`;
    html += `<tr><td>${d}</td>`;
    slots.forEach(s=>{
      const ids = cellMap[dateStr+'__'+s.id] || [];
      const names = ids.map(id=>staffMap[id]||'?').join('、');
      html += editable
        ? `<td><input type="text" class="shift-cell" data-date="${dateStr}" data-slot="${s.id}" value="${esc(names)}" style="border:none;width:100%;font-size:13px;"/></td>`
        : `<td>${esc(names)||'—'}</td>`;
    });
    html += '</tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function readShiftTableFromDOM(){
  const staffByName = {}; state.boot.staff.forEach(s=>staffByName[s.name]=s.id);
  const assignments = [];
  document.querySelectorAll('.shift-cell').forEach(inp=>{
    const names = inp.value.split(/[、,]/).map(x=>x.trim()).filter(Boolean);
    names.forEach(name=>{
      const staffId = staffByName[name];
      if(staffId) assignments.push({date: inp.dataset.date, slotId: inp.dataset.slot, staffId});
    });
  });
  return assignments;
}

function exportShiftPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const slots = state.boot.slots.filter(s=>s.locationId===state.locationId);
  const staffMap = {}; state.boot.staff.forEach(s=>staffMap[s.id]=s.name);
  const n = daysInMonth(state.month);
  const cellMap = {};
  state.shifts.forEach(a=>{ const k=a.date+'__'+a.slotId; (cellMap[k]=cellMap[k]||[]).push(a.staffId); });

  const loc = state.boot.locations.find(l=>l.id===state.locationId);
  doc.setFontSize(14);
  doc.text(`シフト表  ${state.month}  ${loc?loc.name:''}`, 14, 16);

  const head = [['日付', ...slots.map(s=>`${s.name}(${s.start}-${s.end})`)]];
  const body = [];
  for(let d=1; d<=n; d++){
    const dateStr = `${state.month}-${pad(d)}`;
    body.push([String(d), ...slots.map(s=>{
      const ids = cellMap[dateStr+'__'+s.id] || [];
      return ids.map(id=>staffMap[id]||'?').join('、') || '—';
    })]);
  }
  doc.autoTable({ head, body, startY: 22, styles:{fontSize:9, font:'helvetica'} });
  doc.save(`shift_${state.month}.pdf`);
}

/* ====================================================================
   起動
   ==================================================================== */
boot();
</script>
